name: tests

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # Isaac Sim 4.5

      # CPU-only torch wheel first, so the [deploy] extra does not pull the CUDA build.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install "./source/CrazyPlayGround[deploy]" pytest

      - name: Run tests
        run: pytest
